<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>핵심어 퀴즈</title>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      text-align: center;
      background-color: #eef5f3; /* 클레이 스타일에 맞는 화사하고 부드러운 배경 */
      margin: 0;
      padding: 20px;
      user-select: none;
      -webkit-user-select: none; /* 갤탭 텍스트 선택 방지 */
    }
    h1 { font-size: 34px; color: #2c3e50; margin-bottom: 30px; word-break: keep-all; }
    h2 { font-size: 26px; color: #34495e; }
    
    /* 클레이모피즘 컨테이너 스타일 */
    .container { 
      max-width: 800px; 
      margin: 20px auto; 
      background: #ffffff; 
      padding: 40px 30px; 
      border-radius: 35px; 
      box-shadow: 12px 12px 24px #cbd5d1, -12px -12px 24px #ffffff, inset 4px 4px 8px rgba(255,255,255,0.7);
      position: relative; 
    }
    
    /* 기본 클레이 버튼 */
    .btn {
      display: inline-block;
      font-size: 24px;
      font-weight: bold;
      padding: 20px 45px;
      margin: 12px;
      border: none;
      border-radius: 25px;
      background: #f5f9f8;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 8px 8px 16px #cbd5d1, -8px -8px 16px #ffffff, inset 5px 5px 10px rgba(255,255,255,0.9), inset -5px -5px 10px rgba(0,0,0,0.03);
      -webkit-tap-highlight-color: transparent;
    }
    /* 버튼 누를 때 푹 들어가는 효과 */
    .btn:active { 
      transform: scale(0.96); 
      box-shadow: inset 6px 6px 12px #cbd5d1, inset -6px -6px 12px #ffffff;
    }
    
    /* 메인 포인트 클레이 버튼 (초록 계열) */
    .btn-primary { 
      background: #7bd3ab; 
      color: white; 
      box-shadow: 8px 8px 16px #b6cfc4, -8px -8px 16px #ffffff, inset 5px 5px 10px rgba(255,255,255,0.4), inset -5px -5px 10px rgba(0,0,0,0.1);
    }
    .btn-primary:active {
      box-shadow: inset 6px 6px 12px #98c4b0, inset -6px -6px 12px #ffffff;
    }
    
    /* 선택지 전용 파스텔 클레이 버튼 (파랑 계열) */
    .btn-option { 
      background: #bae1ff; 
      color: #1e5885; 
      width: 85%; 
      max-width: 450px; 
      box-shadow: 8px 8px 16px #cbd5d1, -8px -8px 16px #ffffff, inset 5px 5px 10px rgba(255,255,255,0.6), inset -5px -5px 10px rgba(0,0,0,0.06);
    }
    .btn-option:active {
      box-shadow: inset 6px 6px 12px #a2c4df, inset -6px -6px 12px #ffffff;
    }
    
    .hidden { display: none !important; }
    #question-text { font-size: 32px; margin: 40px 0; font-weight: bold; color: #2c3e50; word-break: keep-all; line-height: 1.5; }
    
    /* 피드백 오버레이 클레이 스타일 */
    #feedback-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 35px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 10;
    }
    #feedback-text { font-size: 36px; font-weight: bold; color: #e04f4f; word-break: keep-all; margin: 30px; line-height: 1.6; }
  </style>
</head>
<body>

    <div id="screen-student">
      <h1>👋 퀴즈를 풀 친구는 누구인가요?</h1>
      <div id="student-list"></div>
    </div>

    <div id="screen-category" class="hidden">
      <h1>📚 어떤 핵심어를 공부할까요?</h1>
      <div id="category-list"></div>
    </div>

    <div id="screen-quiz" class="hidden">
      <h2 id="category-title"></h2>
      <div id="question-text">질문 나오는 곳</div>
      <div id="options-list"></div>
      
      <div id="feedback-overlay" class="hidden">
        <div id="feedback-text"></div>
        <button class="btn btn-primary" onclick="nextQuestion()">다음 문제 ➡️</button>
      </div>
    </div>

    <div id="screen-finish" class="hidden">
      <h1>🎉 참 잘했어요! 🎉</h1>
      <button class="btn btn-primary" onclick="resetApp()">처음으로 돌아가기</button>

        { id: "s6", answer: "꿈오름 장터", question: "우리 학교에서 열리는 장터의 이름은 무엇일까요? 🎪", sentence_template: "우리 학교 장터는 ___(이에요/예요).", options: ["꿈오름 장터", "별빛 장터", "무지개 장터", "햇살 장터", "행복 장터"] },
        { id: "s7", answer: "일상생활 훈련실", question: "세탁기도 있고 요리도 할 수 있는 우리 학교의 특별실은 어디일까요? 🏫", sentence_template: "그곳은 ___(이에요/예요).", options: ["일상생활 훈련실", "피시방", "오락실", "만화방", "수영장"] },
        { id: "s8", answer: "3층", question: "체력을 튼튼하게 기르는 체력단련실은 몇 층에 있을까요? 💪", sentence_template: "체력단련실은 ___(이에요/예요).", options: ["3층", "1층", "2층", "4층", "5층"] }
      ]
    };

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwi1yeBc8oSxZ6GnrrLPL7bkRdco8pPOyJtKPTpJrVPEXxirrwRmVku01lagbvRw1-_IQ/exec";

    const students = ["윤승원", "김현민", "박지후", "신서연", "이한수", "기타"];
    let currentStudent = "";
    let currentCategory = "";
    let currentQuestions = [];
    let currentQuestionIndex = 0;

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.04);
          gainNode.gain.setValueAtTime(0.08, now);
          gainNode.gain.linearRampToValueAtTime(0, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now); 
          osc.frequency.setValueAtTime(659.25, now + 0.07); 
          osc.frequency.setValueAtTime(783.99, now + 0.14); 
          gainNode.gain.setValueAtTime(0.12, now);
          gainNode.gain.linearRampToValueAtTime(0.12, now + 0.18);
          gainNode.gain.linearRampToValueAtTime(0, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'wrong') { // 오답 효과음 추가
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
          gainNode.gain.setValueAtTime(0.1, now);
          gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'next') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(850, now + 0.12);
          gainNode.gain.setValueAtTime(0.06, now);
          gainNode.gain.linearRampToValueAtTime(0, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        }
      } catch (e) {
        console.log("오디오 에러 무시:", e);
      }
    }

    function vibrate(duration = 50) {
      if (navigator.vibrate) {
        navigator.vibrate(duration);
      }
    }

    function getJosa(word, josaType) {
      if (!word) return '';
      const lastChar = word.charCodeAt(word.length - 1);
      if (lastChar < 0xAC00 || lastChar > 0xD7A3) return josaType.split('/')[0]; 
      
      const hasBatchim = (lastChar - 0xAC00) % 28 > 0;

      switch (josaType) {
        case '은/는': return hasBatchim ? '은' : '는';
        case '이/가': return hasBatchim ? '이' : '가';
        case '을/를': return hasBatchim ? '을' : '를';
        case '과/와': return hasBatchim ? '과' : '와';
        case '이에요/예요': return hasBatchim ? '이에요' : '예요';
        case '으로/로': return hasBatchim && ((lastChar - 0xAC00) % 28 !== 8) ? '으로' : '로'; 
        case '에': return '에'; 
        default: return '';
      }
    }

    function fillTemplate(template, answer) {
      return template.replace(/___\((.*?)\)/, function(match, josaType) {
         return answer + getJosa(answer, josaType);
      });
    }

    function init() {
      const studentDiv = document.getElementById('student-list');
      students.forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary';
        btn.innerText = name;
        btn.onclick = () => { playSound('click'); vibrate(50); selectStudent(name); };
        studentDiv.appendChild(btn);
      });

      const categoryDiv = document.getElementById('category-list');
      Object.keys(QUIZ_POOL).forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = cat;
        btn.onclick = () => { playSound('click'); vibrate(50); selectCategory(cat); };
        categoryDiv.appendChild(btn);
      });
    }

    function selectStudent(name) {
      currentStudent = name;
      document.getElementById('screen-student').classList.add('hidden');
      document.getElementById('screen-category').classList.remove('hidden');
    }

    function selectCategory(cat) {
      currentCategory = cat;
      currentQuestions = [...QUIZ_POOL[cat]];
      currentQuestionIndex = 0;
      
      document.getElementById('category-title').innerText = `[ ${cat} ]`;
      document.getElementById('screen-category').classList.add('hidden');
      document.getElementById('screen-quiz').classList.remove('hidden');
      
      showQuestion();
    }

    function showQuestion() {
      if (currentQuestionIndex >= currentQuestions.length) {
        document.getElementById('screen-quiz').classList.add('hidden');
        document.getElementById('screen-finish').classList.remove('hidden');
        return;
      }

      const q = currentQuestions[currentQuestionIndex];
      document.getElementById('question-text').innerText = q.question;
      
      const optionsDiv = document.getElementById('options-list');
      optionsDiv.innerHTML = "";
      
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-option';
        btn.innerText = opt;
        btn.onclick = () => {
          // 핵심: 친구 카테고리거나 정답일 때만 통과
          if (currentCategory === "친구" || opt === q.answer) {
            playSound('correct'); 
            vibrate([100, 50, 100]); 
            handleAnswer(q, opt);
          } else {
            // 오답일 때 피드백
            playSound('wrong');
            vibrate([50, 50, 50]);
            
            // 틀렸다는 표시로 버튼 색 변하고 흔들림
            btn.style.transition = 'all 0.1s';
            btn.style.backgroundColor = '#ffcdd2';
            btn.style.color = '#c62828';
            btn.style.transform = 'translateX(-10px)';
            
            setTimeout(() => btn.style.transform = 'translateX(10px)', 50);
            setTimeout(() => btn.style.transform = 'translateX(-10px)', 100);
            setTimeout(() => btn.style.transform = 'translateX(0)', 150);
            
            // 0.5초 뒤에 원래 색상으로 원복
            setTimeout(() => {
              btn.style.backgroundColor = '#bae1ff';
              btn.style.color = '#1e5885';
              btn.style.transition = 'all 0.2s ease';
            }, 500);
          }
        };
        optionsDiv.appendChild(btn);
        optionsDiv.appendChild(document.createElement('br'));
      });
    }

    function handleAnswer(questionData, selectedOption) {
      const url = `${SCRIPT_URL}?student=${encodeURIComponent(currentStudent)}&category=${encodeURIComponent(currentCategory)}&question=${encodeURIComponent(questionData.question)}&answer=${encodeURIComponent(selectedOption)}`;
      fetch(url, { method: 'GET', mode: 'no-cors' }).catch(err => console.error('시트 에러:', err));

      const completedSentence = fillTemplate(questionData.sentence_template, selectedOption);
      document.getElementById('feedback-text').innerText = completedSentence;
      document.getElementById('feedback-overlay').classList.remove('hidden');
    }

    function nextQuestion() {
      playSound('next');
      vibrate(50);
      document.getElementById('feedback-overlay').classList.add('hidden');
      currentQuestionIndex++;
      showQuestion();
    }

    function resetApp() {
      playSound('next');
      vibrate(50);
      currentStudent = "";
      currentCategory = "";
      currentQuestions = [];
      document.getElementById('screen-finish').classList.add('hidden');
      document.getElementById('screen-student').classList.remove('hidden');
    }

    window.onload = init;
  </script>
